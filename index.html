<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Fresas & Crema Co.</title>


<!-- QR CODE -->
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

padding:20px;

background:#111111;

font-family:Arial, sans-serif;

color:white;

overflow-x:hidden;

}


/* DECORACIÓN */

body::before{

content:"";

position:fixed;

width:220px;
height:220px;

border-radius:50%;

background:#f3a6bd;

opacity:.08;

left:-120px;
bottom:-70px;

}

body::after{

content:"";

position:fixed;

width:160px;
height:160px;

border-radius:50%;

background:#f3a6bd;

opacity:.05;

right:-80px;
top:-50px;

}


/* TARJETA */

.card{

width:390px;

max-width:100%;

background:#151515;

border:1px solid rgba(243,166,189,.25);

border-radius:30px;

padding:32px 28px 30px;

text-align:center;

box-shadow:

0 25px 60px rgba(0,0,0,.55),

0 0 40px rgba(243,166,189,.05);

position:relative;

overflow:hidden;

animation:entrada .8s ease;

}


/* LÍNEA SUPERIOR */

.card::before{

content:"";

position:absolute;

top:0;
left:0;
right:0;

height:2px;

background:

linear-gradient(

90deg,

transparent,

#f3a6bd,

transparent

);

}


/* LOGO */

.logo{

margin-bottom:22px;

}

.logo img{

width:190px;

max-width:80%;

display:block;

margin:auto;

}


/* DECORACIÓN */

.decoracion{

font-size:22px;

color:#f3a6bd;

letter-spacing:8px;

margin-bottom:8px;

}


/* NOMBRE */

h1{

font-family:Georgia, serif;

font-size:30px;

font-weight:normal;

color:white;

margin-bottom:6px;

}


/* ID */

.id{

font-size:12px;

letter-spacing:3px;

color:#888;

margin-bottom:25px;

}


/* COMPRAS */

.compras{

font-size:16px;

letter-spacing:2px;

color:#ddd;

margin-bottom:18px;

}


/* SELLOS */

.sellos{

display:flex;

justify-content:center;

gap:10px;

margin:20px 0 18px;

}

.sello{

width:42px;

height:42px;

border-radius:50%;

border:1px solid #555;

display:flex;

align-items:center;

justify-content:center;

font-size:20px;

color:#555;

transition:.3s;

}

.sello.activo{

border-color:#f3a6bd;

background:rgba(243,166,189,.12);

color:#f3a6bd;

box-shadow:

0 0 12px rgba(243,166,189,.25);

transform:scale(1.05);

}


/* BARRA */

.progress{

width:100%;

height:7px;

background:#292929;

border-radius:20px;

overflow:hidden;

margin:10px 0 25px;

}

.progress-bar{

height:100%;

width:0%;

background:

linear-gradient(

90deg,

#d982a1,

#f3a6bd

);

border-radius:20px;

transition:1s ease;

}


/* PREMIO */

.premio{

font-size:18px;

font-weight:bold;

color:#f3a6bd;

margin-top:12px;

min-height:25px;

}

.premio-activo{

animation:brillo 1.2s infinite alternate;

}


/* MENSAJE */

.mensaje{

font-size:14px;

line-height:1.6;

color:#aaa;

margin-top:10px;

}


/* QR */

.qr-section{

margin-top:30px;

padding-top:25px;

border-top:1px solid #292929;

}


/* CAJA DEL QR */

.qr-box{

width:263px;

height:263px;

background:white;

border-radius:27px;

margin:0 auto;

display:flex;

align-items:center;

justify-content:center;

padding:18px;

box-shadow:

0 10px 30px rgba(0,0,0,.35);

}


/* QR */

#qrcode{

width:225px;

height:225px;

display:flex;

align-items:center;

justify-content:center;

}

#qrcode img{

width:225px !important;

height:225px !important;

display:block;

}

#qrcode canvas{

width:225px !important;

height:225px !important;

display:block;

}


/* TEXTO SCAN */

.scan-text{

margin-top:15px;

letter-spacing:6px;

font-size:14px;

font-weight:bold;

color:#f3a6bd;

}


/* FOOTER */

.footer{

margin-top:28px;

font-family:Georgia, serif;

font-size:16px;

color:#888;

}

.footer span{

color:#f3a6bd;

}


/* ANIMACIONES */

@keyframes entrada{

from{

opacity:0;

transform:translateY(25px) scale(.97);

}

to{

opacity:1;

transform:translateY(0) scale(1);

}

}


@keyframes brillo{

from{

text-shadow:

0 0 0px #f3a6bd;

}

to{

text-shadow:

0 0 15px #f3a6bd;

}

}


/* RESPONSIVE */

@media(max-width:430px){

.card{

padding:28px 20px;

}

h1{

font-size:27px;

}

.qr-box{

width:245px;
height:245px;

}

#qrcode{

width:209px;
height:209px;

}

#qrcode img,
#qrcode canvas{

width:209px !important;
height:209px !important;

}

.sello{

width:38px;
height:38px;

}

}

</style>

</head>


<body>


<div class="card">


<div class="logo">

<img src="logo.jpeg" alt="Fresas & Crema Co.">

</div>


<div class="decoracion">

♡ 🍓 ♡

</div>


<h1 id="nombre">

Cargando...

</h1>


<div class="id" id="clienteID">

CLIENTE

</div>


<div class="compras" id="compras">

Cargando compras...

</div>


<!-- SELLOS -->

<div class="sellos">

<div class="sello" id="sello1">🍓</div>

<div class="sello" id="sello2">🍓</div>

<div class="sello" id="sello3">🍓</div>

<div class="sello" id="sello4">🍓</div>

<div class="sello" id="sello5">🍓</div>

<div class="sello" id="sello6">🍓</div>

</div>


<!-- BARRA -->

<div class="progress">

<div
class="progress-bar"
id="barra">
</div>

</div>


<!-- PREMIO -->

<div
class="premio"
id="premio">
</div>


<div
class="mensaje"
id="mensaje">

Cargando información...

</div>


<!-- QR -->

<div class="qr-section">


<div class="qr-box">

<div id="qrcode"></div>

</div>


<div class="scan-text">

SCAN ME

</div>


</div>


<div class="footer">

Fresas & Crema Co. <span>♡</span>

</div>


</div>



<script>


/* =====================================
   API
===================================== */

const API =

"https://script.google.com/macros/s/AKfycbwUYoG26VicpM1Y3uWhJ-H86BpI93CPUKQZL57-rokQYHS-SIz6sgK7GIM4oZTp_n4/exec";


/* =====================================
   OBTENER ID
===================================== */

const params =
new URLSearchParams(
window.location.search
);

const id =
params.get("id");


/* =====================================
   CREAR QR
===================================== */

function generarQR(id){

const contenedor =
document.getElementById("qrcode");


contenedor.innerHTML = "";


/*
URL QUE ABRIRÁ EL ADMIN
*/

const scanURL =

"https://fannyml21.github.io/fresas-clientes/scan.html?id="

+ encodeURIComponent(id);


/*
Intentar generar QR
*/

try{

if(typeof QRCode !== "undefined"){

new QRCode(contenedor,{

text:scanURL,

width:225,

height:225,

colorDark:"#111111",

colorLight:"#ffffff",

correctLevel:
QRCode.CorrectLevel.H

});

return;

}

}catch(error){

console.log(
"Error generando QR:",
error
);

}


/*
RESPALDO
*/

const qrImagen =

"https://api.qrserver.com/v1/create-qr-code/?size=300x300&data="

+ encodeURIComponent(scanURL);


const imagen =
document.createElement("img");


imagen.src =
qrImagen;

imagen.alt =
"QR de cliente";


imagen.width =
225;

imagen.height =
225;


contenedor.appendChild(imagen);

}


/* =====================================
   CARGAR CLIENTE
===================================== */

async function cargarCliente(){

try{


if(!id){

document.getElementById("nombre").innerText =
"Cliente no encontrado";

return;

}


/* CONSULTAR API */

const response =

await fetch(

`${API}?id=${encodeURIComponent(id)}&t=${Date.now()}`

);


const data =
await response.json();


console.log(
"Cliente:",
data
);


/* NOMBRE */

document.getElementById(
"nombre"
).innerText =

data.nombre || "Cliente";


/* ID */

document.getElementById(
"clienteID"
).innerText =

data.id || id;


/* COMPRAS */

const compras =
Number(data.compras) || 0;


document.getElementById(
"compras"
).innerText =

`Compras acumuladas: ${compras}`;


/* =====================================
   RECOMPENSAS
===================================== */

const recompensas =

Math.floor(
compras / 6
);


const sobrantes =

compras % 6;


/* =====================================
   SELLOS
===================================== */

const comprasEnCiclo =
compras % 6;


for(let i = 1; i <= 6; i++){

const sello =
document.getElementById(
"sello" + i
);

if(
i <= comprasEnCiclo ||

(comprasEnCiclo === 0 && compras > 0 && i <= 6)
){

sello.classList.add(
"activo"
);

}

}


/* =====================================
   BARRA
===================================== */

let porcentaje =

(comprasEnCiclo / 6) * 100;


/*
Si tiene exactamente 6,
la barra se muestra completa
*/

if(
compras > 0 &&
compras % 6 === 0
){

porcentaje = 100;

}


document.getElementById(
"barra"
).style.width =

porcentaje + "%";


/* =====================================
   PREMIO
===================================== */

if(recompensas > 0){

document.getElementById(
"premio"
).innerText =

`🎉 ¡Tienes ${recompensas} recompensa${recompensas > 1 ? "s" : ""}!`;

document.getElementById(
"premio"
).classList.add(
"premio-activo"
);


if(sobrantes > 0){

document.getElementById(
"mensaje"
).innerText =

`Tienes ${sobrantes} compra${sobrantes > 1 ? "s" : ""} acumulada${sobrantes > 1 ? "s" : ""} para tu próxima recompensa 🍓`;

}else{

document.getElementById(
"mensaje"
).innerText =

"Tu recompensa está lista para ser canjeada 🍓";

}


/* CONFETI */

if(typeof confetti !== "undefined"){

confetti({

particleCount:120,

spread:80,

origin:{
y:.6
}

});

}

}
else{


const faltan =
6 - compras;


document.getElementById(
"premio"
).innerText =

"Premio en progreso ✨";


document.getElementById(
"mensaje"
).innerText =

`Te faltan ${faltan} compra${faltan > 1 ? "s" : ""} para desbloquear tu recompensa`;


}


/* =====================================
   GENERAR QR
===================================== */

generarQR(id);


}
catch(error){

console.error(
"Error:",
error
);


document.getElementById(
"nombre"
).innerText =

"Error";


document.getElementById(
"mensaje"
).innerText =

"No se pudo cargar la información";


/*
Aun si falla la API,
intentamos generar el QR
*/

if(id){

generarQR(id);

}

}

}


/* =====================================
   INICIAR
===================================== */

cargarCliente();

</script>


<!-- CONFETTI -->

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>


</body>

</html>
