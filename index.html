<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>


<style>

<style>

/* ==========================================
   CONFIGURACIÓN GENERAL
========================================== */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}


body{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:

radial-gradient(
circle at top left,
rgba(243,166,189,.16),
transparent 35%
),

radial-gradient(
circle at bottom right,
rgba(243,166,189,.10),
transparent 35%
),

#0d0d0d;

padding:20px;

color:white;

}


/* ==========================================
   TARJETA
========================================== */

.card{

width:100%;

max-width:390px;

background:#151515;

border:1px solid rgba(243,166,189,.65);

border-radius:30px;

padding:28px 25px 25px;

text-align:center;

position:relative;

overflow:hidden;

box-shadow:

0 20px 60px rgba(0,0,0,.55),

0 0 35px rgba(243,166,189,.08);

animation:entrada .8s ease;

}


/* brillo decorativo */

.card::before{

content:"";

position:absolute;

width:180px;

height:180px;

border-radius:50%;

background:rgba(243,166,189,.07);

top:-90px;

right:-80px;

}

.card::after{

content:"";

position:absolute;

width:140px;

height:140px;

border-radius:50%;

background:rgba(243,166,189,.05);

bottom:-70px;

left:-60px;

}


/* ==========================================
   DECORACIÓN SUPERIOR
========================================== */

.decoracion{

color:#f3a6bd;

font-size:17px;

letter-spacing:5px;

margin-bottom:12px;

}


/* ==========================================
   LOGO
========================================== */

.logo{

display:flex;

justify-content:center;

margin-bottom:15px;

position:relative;

z-index:2;

}


.logo img{

width:175px;

max-width:80%;

height:auto;

}


/* ==========================================
   TEXTO
========================================== */

.titulo{

font-size:12px;

letter-spacing:4px;

text-transform:uppercase;

color:#aaaaaa;

margin-bottom:8px;

}


.nombre{

font-family:Georgia, serif;

font-size:30px;

font-weight:bold;

color:#f3a6bd;

margin-bottom:18px;

word-break:break-word;

}


/* ==========================================
   SECCIÓN DE COMPRAS
========================================== */

.seccion-compras{

background:#1d1d1d;

border:1px solid #303030;

border-radius:22px;

padding:20px 16px;

position:relative;

z-index:2;

}


.etiqueta{

font-size:12px;

letter-spacing:2px;

text-transform:uppercase;

color:#999999;

margin-bottom:7px;

}


.numero-compras{

font-family:Georgia, serif;

font-size:30px;

font-weight:bold;

color:white;

}


.numero-compras span{

color:#f3a6bd;

}


/* ==========================================
   ESTAMPAS DE LAS 6 COMPRAS
========================================== */

.estampas{

display:flex;

justify-content:center;

gap:8px;

margin-top:18px;

}


.estampa{

width:34px;

height:34px;

border-radius:50%;

border:1px solid #555;

display:flex;

align-items:center;

justify-content:center;

font-size:15px;

background:#111;

color:#777;

transition:.3s;

}


.estampa.activa{

background:#f3a6bd;

border-color:#f3a6bd;

color:#111;

box-shadow:
0 0 12px rgba(243,166,189,.35);

transform:scale(1.05);

}


/* ==========================================
   BARRA
========================================== */

.progress{

width:100%;

height:8px;

background:#303030;

border-radius:20px;

overflow:hidden;

margin-top:20px;

}


.progress-bar{

height:100%;

width:0%;

background:

linear-gradient(
90deg,
#d986a3,
#f3a6bd,
#ffd2df
);

border-radius:20px;

transition:width .7s ease;

}


/* ==========================================
   RECOMPENSA
========================================== */

.premio{

margin-top:20px;

font-size:18px;

font-weight:bold;

color:#f3a6bd;

}


.premio-activo{

animation:brillo 1.2s infinite alternate;

}


.recompensas-extra{

margin-top:7px;

font-size:13px;

color:#bdbdbd;

}


/* ==========================================
   MENSAJE
========================================== */

.mensaje{

margin-top:14px;

font-size:14px;

line-height:1.5;

color:#cfcfcf;

}


/* ==========================================
   QR
========================================== */

.qr-section{

margin-top:30px;

padding-top:25px;

border-top:1px solid #292929;

}


/* CAJA DEL QR */

.qr-box{

width:263px;

height:263px;

background:white;

border-radius:27px;

margin:0 auto;

display:flex;

align-items:center;

justify-content:center;

padding:18px;

box-shadow:

0 10px 30px rgba(0,0,0,.35);

}


/* QR */

#qrcode{

width:225px;

height:225px;

display:flex;

align-items:center;

justify-content:center;

}

#qrcode img{

width:225px !important;

height:225px !important;

display:block;

}

#qrcode canvas{

width:225px !important;

height:225px !important;

display:block;

}


/* TEXTO SCAN */

.scan-text{

margin-top:15px;

letter-spacing:6px;

font-size:14px;

font-weight:bold;

color:#f3a6bd;

}

/* ==========================================
   PIE
========================================== */

.footer{

margin-top:22px;

font-size:12px;

color:#777;

letter-spacing:1px;

}


.footer span{

color:#f3a6bd;

}


/* ==========================================
   ANIMACIONES
========================================== */

@keyframes entrada{

from{

opacity:0;

transform:
translateY(30px)
scale(.96);

}

to{

opacity:1;

transform:
translateY(0)
scale(1);

}

}


@keyframes brillo{

from{

transform:scale(1);

text-shadow:
0 0 0 rgba(243,166,189,0);

}

to{

transform:scale(1.03);

text-shadow:
0 0 18px rgba(243,166,189,.65);

}

}


/* ==========================================
   MÓVIL
========================================== */

@media(max-width:380px){

.card{

padding:
25px 18px 22px;

}


.nombre{

font-size:26px;

}


.estampa{

width:31px;

height:31px;

font-size:13px;

}

}

</style>

</head>


<!-- ==========================================
     CONFETTI
========================================== -->

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>


<body>


<div class="card">


<!-- DECORACIÓN -->

<div class="decoracion">

♡ 🍓 ♡

</div>


<!-- LOGO -->

<div class="logo">

<img
src="logo.jpeg"
alt="Fresas & Crema Co."
>

</div>


<div class="titulo">

Tarjeta de lealtad

</div>


<!-- NOMBRE -->

<div
class="nombre"
id="nombre"
>

Cargando...

</div>


<!-- COMPRAS -->

<div class="seccion-compras">


<div class="etiqueta">

Tu progreso

</div>


<div
class="numero-compras"
id="compras"
>

Cargando...

</div>


<!-- 6 ESTAMPAS -->

<div class="estampas">

<div class="estampa" id="s1">🍓</div>

<div class="estampa" id="s2">🍓</div>

<div class="estampa" id="s3">🍓</div>

<div class="estampa" id="s4">🍓</div>

<div class="estampa" id="s5">🍓</div>

<div class="estampa" id="s6">🍓</div>

</div>


<!-- BARRA -->

<div class="progress">

<div
class="progress-bar"
id="barra"
></div>

</div>


</div>


<!-- RECOMPENSA -->

<div
class="premio"
id="premio"
>

Cargando...

</div>


<div
class="recompensas-extra"
id="recompensasExtra"
>

</div>


<div
class="mensaje"
id="mensaje"
>

Cargando información...

</div>


<!-- QR -->

<div class="qr-section">


<div class="qr-title">

Presenta este código para registrar tu compra

</div>


<div class="qr-container">

<img
id="qr"
src=""
alt="Código QR"
>

</div>


<div class="scan-text">

SCAN ME

</div>


</div>


<!-- FOOTER -->

<div class="footer">

Fresas & Crema Co. <span>♡</span>

</div>


</div>



<script>


// ==========================================
// API
// ==========================================

const API =
"https://script.google.com/macros/s/AKfycbwUYoG26VicpM1Y3uWhJH-J86BpI93CPUKQZL57-rokQYHS-SIz6sgK7GIM4oZTp_n4/exec";


// ==========================================
// OBTENER ID
// ==========================================

const params =
new URLSearchParams(
window.location.search
);

const id =
params.get("id");


// ==========================================
// CARGAR CLIENTE
// ==========================================

async function cargarCliente(){


if(!id){

document
.getElementById("nombre")
.innerText =
"Cliente";


document
.getElementById("mensaje")
.innerText =
"No se encontró el identificador de la tarjeta.";

return;

}


try{


const response =
await fetch(
`${API}?id=${encodeURIComponent(id)}&t=${Date.now()}`
);


const data =
await response.json();


if(!data.nombre){

throw new Error(
"Cliente no encontrado"
);

}


// ==========================================
// NOMBRE
// ==========================================

document
.getElementById("nombre")
.innerText =
data.nombre;


// ==========================================
// COMPRAS
// ==========================================

const compras =
Number(data.compras) || 0;


// Número de recompensas disponibles

const recompensas =
Math.floor(compras / 6);


// Compras hacia la siguiente recompensa

const sobrantes =
compras % 6;


// ==========================================
// TEXTO DE COMPRAS
// ==========================================

if(recompensas > 0){

document
.getElementById("compras")
.innerHTML =

`${compras} <span>compras</span>`;

}else{

document
.getElementById("compras")
.innerHTML =

`${compras} <span>/ 6</span>`;

}


// ==========================================
// ESTAMPAS
// ==========================================

const comprasEnCiclo =
compras % 6;


for(let i = 1; i <= 6; i++){

const estampa =
document.getElementById(
`s${i}`
);


if(
comprasEnCiclo >= i ||
(comprasEnCiclo === 0 && compras >= 6)
){

estampa.classList.add(
"activa"
);

}

}


// ==========================================
// BARRA DE PROGRESO
// ==========================================

let porcentaje =
(comprasEnCiclo / 6) * 100;


// Si acaba de completar exactamente
// una recompensa, mostrar la barra llena

if(compras > 0 && compras % 6 === 0){

porcentaje = 100;

}


document
.getElementById("barra")
.style.width =
`${porcentaje}%`;


// ==========================================
// RECOMPENSAS
// ==========================================

const premio =
document.getElementById(
"premio"
);

const extra =
document.getElementById(
"recompensasExtra"
);

const mensaje =
document.getElementById(
"mensaje"
);


if(recompensas > 0){

premio.innerText =
"🎉 ¡Tienes una recompensa!";


extra.innerText =

recompensas === 1

? "Tienes 1 recompensa disponible"

: `Tienes ${recompensas} recompensas disponibles`;


mensaje.innerText =

sobrantes === 0

? "Puedes canjear tu recompensa en tu próxima visita 🍓"

: `Además, tienes ${sobrantes} compra${sobrantes === 1 ? "" : "s"} acumulada${sobrantes === 1 ? "" : "s"} para tu siguiente recompensa. 🍓`;


premio.classList.add(
"premio-activo"
);


// ==========================================
// CONFETTI
// ==========================================

if(navigator.vibrate){

navigator.vibrate([
200,
100,
200
]);

}


if(typeof confetti === "function"){

confetti({

particleCount:120,

spread:80,

origin:{
y:.6
}

});

}


}else{

premio.innerText =
"✨ Premio en progreso";


extra.innerText =
"";


const faltan =
6 - comprasEnCiclo;


mensaje.innerText =

`Te faltan ${faltan} compra${faltan === 1 ? "" : "s"} para desbloquear tu recompensa. 🍓`;

}


}catch(error){


console.error(error);


document
.getElementById("nombre")
.innerText =
"Error";


document
.getElementById("mensaje")
.innerText =
"No se pudo cargar la información de tu tarjeta.";


}

}


// ==========================================
// INICIAR
// ==========================================

cargarCliente();

</script>


</body>

</html>
