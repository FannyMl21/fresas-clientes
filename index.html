<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cliente Frecuente</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:
linear-gradient(
135deg,
#fff0f3,
#ffe5ec,
#ffeef2
);
padding:20px;
}

.card{

width:350px;

background:rgba(255,255,255,0.65);

backdrop-filter:blur(15px);

border-radius:30px;

padding:35px 30px;

box-shadow:
0 10px 30px rgba(0,0,0,0.08);

text-align:center;

border:1px solid rgba(255,255,255,0.4);

animation:fade 0.7s ease;

animation:entrada 0.8s ease;

transition:0.4s;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(15px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.logo{
margin-bottom:25px;
}

.logo img{
width:220px;
max-width:100%;
}

h1{
font-size:38px;
margin-bottom:15px;
color:#222;
}

.compras{
font-size:20px;
margin-top:10px;
color:#555;
}

.premio{
margin-top:15px;
font-size:20px;
font-weight:bold;
color:#ff4d6d;
}

.progress{
width:100%;
height:22px;
background:#eee;
border-radius:20px;
overflow:hidden;
margin-top:25px;
}

.progress-bar{
height:100%;
width:0%;
background:
linear-gradient(
90deg,
#ff4d6d,
#ff758f
);
border-radius:20px;
transition:0.4s;
}

.mensaje{
margin-top:25px;
font-size:17px;
color:#666;
line-height:1.5;
}

.footer{
margin-top:25px;
font-size:14px;
color:#999;
}

.qr-section{
margin-top:35px;
}

.qr-section img{
width:220px;
background:white;
padding:12px;
border-radius:25px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

.scan-text{
margin-top:10px;
letter-spacing:6px;
font-size:14px;
color:#ff4d6d;
font-weight:bold;
}

@keyframes entrada{

from{
opacity:0;
transform:
translateY(30px)
scale(0.95);
}

to{
opacity:1;
transform:
translateY(0)
scale(1);
}

}

.qr-section img{

transition:0.4s;

animation:flotar 3s ease-in-out infinite;

}

@keyframes flotar{

0%{
transform:translateY(0px);
}

50%{
transform:translateY(-8px);
}

100%{
transform:translateY(0px);
}

}

.premio-activo{

animation:brillo 1s infinite alternate;

}

@keyframes brillo{

from{
transform:scale(1);
text-shadow:0 0 0px #ff4d6d;
}

to{
transform:scale(1.03);
text-shadow:0 0 18px #ff4d6d;
}

}
  
</style>

</head>
  
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<body>

<div class="card">

<div class="logo">
<img src="logo.jpeg" alt="Logo">
</div>

<h1 id="nombre">
Cargando...
</h1>

<p class="compras" id="compras"></p>

<p class="premio" id="premio"></p>

<div class="progress">
<div class="progress-bar" id="barra"></div>
</div>

<p class="mensaje" id="mensaje">
Cargando información...
</p>

<div class="qr-section">

<img id="qr" src="">

<p class="scan-text">
SCAN ME
</p>

</div>

<div class="footer">
Gracias por elegirnos ❤️
</div>

</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbwUYoG26VicpM1Y3uWhJH-J86BpI93CPUKQZL57-rokQYHS-SIz6sgK7GIM4oZTp_n4/exec";

const params = new URLSearchParams(window.location.search);

const id = params.get("id");

async function cargarCliente(){

const response = await fetch(`${API}?id=${id}`);

const data = await response.json();

document.getElementById("nombre").innerText =
data.nombre;

document.getElementById("compras").innerText =
`Compras: ${data.compras}/6`;

let porcentaje = (data.compras / 6) * 100;

document.getElementById("barra").style.width =
`${porcentaje}%`;

if(data.compras >= 6){

document.getElementById("premio").innerText =
"🎉 ¡Tu recompensa está lista!";

document.getElementById("mensaje").innerText =
"Puedes canjear tus fresas gratis en tu próxima compra 🍓";

}

document
.getElementById("premio")
.classList
.add("premio-activo");

if(navigator.vibrate){

navigator.vibrate([200,100,200]);

}

confetti({

particleCount:150,

spread:90,

origin:{ y:0.6 }

});
  
else{

let faltan = 6 - data.compras;

document.getElementById("premio").innerText =
"Premio en progreso ✨";

document.getElementById("mensaje").innerText =
`Te faltan ${faltan} compras para desbloquear tu recompensa`;

}

}

const qr =
`https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://fannyml21.github.io/fresas-clientes/scan.html?id=${id}`;

document.getElementById("qr").src = qr;

cargarCliente();

</script>

</body>
</html>
