<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin Login</title>

<style>

body{

font-family:Arial;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

background:#ffe5ec;

}

.card{

background:white;

padding:40px;

border-radius:25px;

box-shadow:0 10px 25px rgba(0,0,0,0.08);

width:320px;

text-align:center;

}

h1{
margin-bottom:20px;
color:#ff4d6d;
}

input{

width:100%;

padding:14px;

border-radius:12px;

border:1px solid #ddd;

margin-top:15px;

font-size:16px;

box-sizing:border-box;

}

button{

width:100%;

padding:14px;

margin-top:20px;

border:none;

border-radius:12px;

background:#ff4d6d;

color:white;

font-size:16px;

cursor:pointer;

}

p{
margin-top:15px;
color:#555;
}

</style>

</head>

<body>

<div class="card">

<h1>🍓 Admin</h1>

<input
type="password"
id="password"
placeholder="Contraseña"
>

<button onclick="login()">
Ingresar
</button>

<p id="mensaje"></p>

</div>

<script>

function login(){

const password =
document.getElementById("password").value;

if(password === "fresas2026"){

localStorage.setItem("admin","true");

document.getElementById("mensaje")
.innerText =
"✅ Acceso concedido";

setTimeout(()=>{

window.location.href =
"admin.html";

},1000);

}
else{

document.getElementById("mensaje")
.innerText =
"❌ Contraseña incorrecta";

}

}

</script>

</body>
</html>
