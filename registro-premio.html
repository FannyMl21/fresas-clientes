<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Registrar Premio</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:
linear-gradient(
135deg,
#fff0f3,
#ffe5ec,
#fff5f7
);

padding:20px;

}

.card{

width:360px;

background:white;

padding:35px;

border-radius:30px;

box-shadow:
0 10px 30px rgba(0,0,0,0.1);

text-align:center;

}

.logo img{
width:180px;
margin-bottom:20px;
}

h1{
font-size:30px;
color:#ff4d6d;
margin-bottom:20px;
}

.premio{

background:#fff0f3;

padding:15px;

border-radius:20px;

font-size:20px;

font-weight:bold;

color:#ff4d6d;

margin-bottom:20px;

}

input{

width:100%;

padding:15px;

margin-top:15px;

border-radius:15px;

border:1px solid #ddd;

font-size:16px;

}

button{

width:100%;

padding:16px;

margin-top:20px;

border:none;

border-radius:18px;

background:#ff4d6d;

color:white;

font-size:18px;

cursor:pointer;

}

.mensaje{

margin-top:20px;

font-size:18px;

line-height:1.5;

color:#444;

}

.codigo{

margin-top:15px;

font-size:22px;

font-weight:bold;

color:#22c55e;

}

</style>

</head>

<body>

<div class="card">

<div class="logo">
<img src="logo.jpeg">
</div>

<h1>🎁 Premio desbloqueado</h1>

<div class="premio" id="premio"></div>

<input
type="text"
id="nombre"
placeholder="Tu nombre"
>

<input
type="text"
id="whatsapp"
placeholder="WhatsApp"
>

<button onclick="guardarPremio()">
Guardar premio
</button>

<div class="mensaje" id="mensaje"></div>

<div class="codigo" id="codigo"></div>

</div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbwUYoG26VicpM1Y3uWhJH-J86BpI93CPUKQZL57-rokQYHS-SIz6sgK7GIM4oZTp_n4/exec";

const params =
new URLSearchParams(window.location.search);

const premio =
params.get("premio");

document.getElementById("premio")
.innerText = premio;

function generarCodigo(){

return "FRESA-" +
Math.floor(
1000 + Math.random() * 9000
);

}

async function guardarPremio(){

const nombre =
document.getElementById("nombre").value;

const whatsapp =
document.getElementById("whatsapp").value;

if(nombre == "" || whatsapp == ""){

alert("Completa todos los campos");

return;

}

const codigo =
generarCodigo();

const response =
await fetch(

`${API}?guardarPremio=true&codigo=${encodeURIComponent(codigo)}&nombre=${encodeURIComponent(nombre)}&whatsapp=${encodeURIComponent(whatsapp)}&premio=${encodeURIComponent(premio)}&t=${Date.now()}`

);

const data =
await response.json();

if(data.success){

document.getElementById("mensaje")
.innerHTML =
"✅ Premio guardado correctamente";

document.getElementById("codigo")
.innerText =
codigo;

document.querySelector("button")
.remove();

document.getElementById("nombre")
.remove();

document.getElementById("whatsapp")
.remove();

}
else{

document.getElementById("mensaje")
.innerHTML =
"❌ Error al guardar";

}

}
  
</script>

</body>
</html>
