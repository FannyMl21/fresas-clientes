<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registro Cliente</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:
linear-gradient(
135deg,
#fff0f3,
#ffe5ec,
#ffeef2
);
padding:20px;
}

.card{

width:350px;

background:rgba(255,255,255,0.65);

backdrop-filter:blur(15px);

border-radius:30px;

padding:35px 30px;

box-shadow:
0 10px 30px rgba(0,0,0,0.08);

text-align:center;

border:1px solid rgba(255,255,255,0.4);

}

.logo{
font-size:50px;
margin-bottom:15px;
}

h1{
font-size:30px;
margin-bottom:20px;
color:#222;
}

input{
width:100%;
padding:14px;
margin-top:15px;
border:none;
border-radius:15px;
font-size:16px;
background:white;
}

button{
width:100%;
padding:15px;
margin-top:20px;
border:none;
border-radius:15px;
background:#ff4d6d;
color:white;
font-size:17px;
cursor:pointer;
}

.mensaje{
margin-top:20px;
font-size:16px;
color:#555;
line-height:1.5;
}

a{
display:block;
margin-top:20px;
color:#ff4d6d;
text-decoration:none;
font-weight:bold;
}

</style>

</head>

<body>

<div class="card">

<div class="logo">🍓</div>

<h1>Únete al Club</h1>

<input
type="text"
id="nombre"
placeholder="Tu nombre"
>

<input
type="text"
id="whatsapp"
placeholder="WhatsApp"
>

<button onclick="registrar()">
Registrarme
</button>

<div class="mensaje" id="mensaje">
Acumula compras y gana recompensas 🍓
</div>

<a id="tarjeta" style="display:none;">
Ver mi tarjeta
</a>

</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbwUYoG26VicpM1Y3uWhJH-J86BpI93CPUKQZL57-rokQYHS-SIz6sgK7GIM4oZTp_n4/exec";

async function registrar(){

const nombre =
document.getElementById("nombre").value;

const whatsapp =
document.getElementById("whatsapp").value;

if(nombre == "" || whatsapp == ""){

alert("Completa todos los campos");

return;

}

const response = await fetch(API,{

method:"POST",

body:JSON.stringify({

action:"register",

nombre:nombre,

whatsapp:whatsapp

})

});

const data = await response.json();

document.getElementById("mensaje").innerText =
`🎉 Registro exitoso\nTu ID es ${data.id}`;

const link =
`https://fannymi21.github.io/fresas-clientes/?id=${data.id}`;

const tarjeta =
document.getElementById("tarjeta");

tarjeta.href = link;

tarjeta.style.display = "block";

}

</script>

</body>
</html>
