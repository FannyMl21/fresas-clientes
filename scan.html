<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Registrar Compra</title>

<style>

body{

font-family:Arial;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

background:#ffe5ec;

text-align:center;

padding:20px;

}

.card{

background:white;

padding:40px;

border-radius:25px;

box-shadow:0 10px 25px rgba(0,0,0,0.08);

max-width:350px;

width:100%;

}

h1{
color:#ff4d6d;
margin-bottom:15px;
font-size:38px;
}

p{
font-size:20px;
color:#444;
margin-top:15px;
line-height:1.5;
}

.loader{

margin:30px auto;

width:60px;
height:60px;

border:6px solid #eee;

border-top:6px solid #ff4d6d;

border-radius:50%;

animation:girar 1s linear infinite;

}

@keyframes girar{

100%{
transform:rotate(360deg);
}

}

.ok{
color:#22c55e;
font-weight:bold;
}

.error{
color:#ef4444;
font-weight:bold;
}

</style>

</head>

<body>

<div class="card">

<h1>🍓 Registrando compra...</h1>

<div class="loader" id="loader"></div>

<p id="mensaje">
Espera un momento
</p>

</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>

const API =
"https://script.google.com/macros/s/AKfycbwUYoG26VicpM1Y3uWhJH-J86BpI93CPUKQZL57-rokQYHS-SIz6sgK7GIM4oZTp_n4/exec";

const params =
new URLSearchParams(window.location.search);

const id =
params.get("id");

const scan =
params.get("scan");

async function registrarCompra(){

const admin =
localStorage.getItem("admin");

if(admin !== "true"){

document.getElementById("loader")
.style.display = "none";

document.getElementById("mensaje")
.innerHTML =
'<span class="error">❌ Acceso denegado</span>';

return;

}

if(!id){

document.getElementById("loader")
.style.display = "none";

document.getElementById("mensaje")
.innerHTML =
'<span class="error">❌ Cliente inválido</span>';

return;

}

try{

const response =
await fetch(
`${API}?id=${id}&scan=true&t=${Date.now()}`
);

const data =
await response.json();

document.getElementById("loader")
.style.display = "none";

if(data.success){

document.getElementById("mensaje")
.innerHTML =
`<span class="ok">✅ Compra registrada 🍓</span>`;

if(navigator.vibrate){

navigator.vibrate(200);

}

confetti({

particleCount:120,

spread:80,

origin:{ y:0.7 }

});

}
else{

document.getElementById("mensaje")
.innerHTML =
'<span class="error">❌ Error al registrar</span>';

}

}
catch(error){

console.log(error);

document.getElementById("loader")
.style.display = "none";

document.getElementById("mensaje")
.innerHTML =
'<span class="error">❌ Error de conexión</span>';

}

}

registrarCompra();

</script>

</body>
</html>
